name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Project sites are served from /<repo>/ — this makes asset URLs resolve.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Optional: add a repository secret named GEMINI_API_KEY to enable live
          # generation. Without it the published site runs in Demo Mode.
          # Note: a key set here is bundled into the public JavaScript.
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Single-page app: 404.html makes deep links fall back to index.html.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
