# Pins the build so a Netlify default change cannot silently break it.
# VITE_BASE_PATH is deliberately unset — Netlify serves from the domain root,
# so vite.config.ts falls back to base "/". Only GitHub Pages needs a subpath.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: unknown paths fall back to index.html rather than 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
